<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mlg-token" content="{{TOKEN}}">
  <title>{{APP}}</title>
  <link rel="icon" href="/ui/icon.png">
  <link rel="stylesheet" href="/ui/app.css?v={{VERSION}}">
</head>
<body>
  <div class="app" id="app">
    <nav class="side" id="side" aria-label="Library">
      <div class="side-head">
        <button type="button" class="icon-btn" id="side-hide" aria-label="Hide the sidebar" title="Hide the sidebar (Ctrl+B)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
        </button>
        <button type="button" class="icon-btn" id="add" aria-label="Add a folder" title="Add a folder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="nav-group">
        <button type="button" class="nav-item" id="view-all">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span class="label">All</span><span class="n" id="all-count"></span>
        </button>
        <button type="button" class="nav-item" id="view-recent" title="What you opened lately, last first">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <span class="label">Recently viewed</span>
        </button>
        <button type="button" class="nav-item" id="view-random" title="Everything in a shuffled order (click again to shuffle again)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5c2.5 0 4 1.5 5.5 4.5S15 16 17.5 16H21M3 16h3.5c1.3 0 2.3-.4 3.2-1.2M14.3 8.2C15.2 7.4 16.2 7 17.5 7H21M18.5 4.5 21 7l-2.5 2.5M18.5 13.5 21 16l-2.5 2.5"/></svg>
          <span class="label">Random</span>
        </button>
        <button type="button" class="nav-item" id="view-trash" title="What you deleted here: put it back any time, or empty it to the Recycle Bin">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          <span class="label">Trash</span><span class="n" id="trash-count"></span>
        </button>
      </div>
      <div class="nav-sep"></div>
      <div class="nav-group">
        <button type="button" class="nav-item" id="view-stats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span class="label">Statistics</span>
        </button>
        <button type="button" class="nav-item" id="view-characters">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
          <span class="label">Characters</span><span class="n" id="char-count"></span>
        </button>
        <button type="button" class="nav-item" id="view-review" title="Files a weak rule matched, waiting for a yes or no">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          <span class="label">To review</span><span class="badge-n" id="review-count" hidden></span>
        </button>
        <button type="button" class="nav-item" id="view-duplicates" title="Copies of one file, and the same picture saved twice">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          <span class="label">Duplicates</span>
        </button>
        <button type="button" class="nav-item" id="view-history" title="What you changed, with Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg>
          <span class="label">History</span>
        </button>
      </div>
      <div class="nav-sep"></div>
      <div class="nav-label">Folders</div>
      <div class="nav-group" id="folders"></div>
      <div class="nav-sep"></div>
      <div class="nav-label with-act">Albums
        <button type="button" class="icon-btn small" id="album-new" aria-label="New album" title="New album">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="nav-group" id="albums"></div>
      <div class="side-foot">
        <button type="button" class="nav-item" id="view-settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          <span class="label">Settings</span>
        </button>
        <p>The Gallery only reads your folders (it moves or deletes only when you ask). Eagle libraries are left out.<br><span class="ver">{{APP}} {{VERSION}}</span></p>
      </div>
    </nav>

    <main class="main">
      <header class="toolbar">
        <button type="button" class="icon-btn" id="side-show" aria-label="Show the sidebar" title="Show the sidebar (Ctrl+B)" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
        </button>
        <div class="title"><h1 id="view-title">All</h1><span class="count" id="count"></span></div>
        <button type="button" class="btn" id="shuffle" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5c2.5 0 4 1.5 5.5 4.5S15 16 17.5 16H21M3 16h3.5c1.3 0 2.3-.4 3.2-1.2M14.3 8.2C15.2 7.4 16.2 7 17.5 7H21M18.5 4.5 21 7l-2.5 2.5M18.5 13.5 21 16l-2.5 2.5"/></svg>Shuffle again
        </button>
        <div class="search" id="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          <div class="chips" id="chips"></div>
          <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search prompts, models, tags…" aria-label="Search"
                 aria-autocomplete="list" aria-controls="suggest" title="Search (Ctrl+F or /)">
          <button type="button" class="clear" id="q-clear" aria-label="Clear the search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <div class="suggest" id="suggest" role="listbox" hidden></div>
        </div>
        <button type="button" class="btn" id="empty-trash" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Empty the Trash</button>
        <button type="button" class="icon-btn toggle" id="f-fav" aria-pressed="false" aria-label="Favourites only" title="Favourites only">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.5-9.3C1.2 7.9 3.3 4.5 6.8 4.5c2 0 3.4 1.1 4.2 2.3h2c.8-1.2 2.2-2.3 4.2-2.3 3.5 0 5.6 3.4 4.3 6.7-2 4.7-9.5 9.3-9.5 9.3Z"/></svg>
        </button>
        <label class="select" title="Show only files rated at least this">
          <select id="f-rating" aria-label="Rating">
            <option value="">Any rating</option>
            <option value="1">★ 1 or more</option>
            <option value="2">★ 2 or more</option>
            <option value="3">★ 3 or more</option>
            <option value="4">★ 4 or more</option>
            <option value="5">★ 5</option>
            <option value="0">Unrated</option>
          </select>
        </label>
        <div class="seg" role="group" aria-label="Show" id="kind">
          <button type="button" data-kind="">All</button>
          <button type="button" data-kind="image">Images</button>
          <button type="button" data-kind="video">Videos</button>
        </div>
        <label class="select" id="sort-wrap">
          <select id="sort" aria-label="Sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name">Name</option>
            <option value="largest">Largest</option>
          </select>
        </label>
        <label class="slider" title="Tile size">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
          <input id="tile" type="range" min="120" max="300" step="4" value="176" aria-label="Tile size">
        </label>
      </header>
      <div class="grid-scroll" id="scroll" tabindex="-1">
        <div class="grid-sizer" id="sizer" role="grid" aria-label="Files"></div>
      </div>
      <div class="empty" id="empty" hidden></div>
      <section class="stats" id="stats" aria-label="Statistics" hidden></section>
      <footer class="statusbar">
        <span class="dot" id="status-dot"></span><span id="status">Up to date</span>
        <span class="spacer"></span><span id="status-right"></span>
      </footer>
      <div class="selbar" id="selbar" role="toolbar" aria-label="Selected files" hidden></div>
    </main>
  </div>

  <div class="viewer" id="viewer" hidden>
    <header class="v-bar">
      <button type="button" class="btn" id="v-close" title="Back to the library (Esc)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg><span id="v-back">Library</span>
      </button>
      <div class="v-title"><span class="v-name" id="v-name"></span><span class="v-meta" id="v-meta"></span></div>
      <div class="spacer"></div>
      <span class="v-pos" id="v-pos"></span>
      <div class="stars" id="v-stars" role="group" aria-label="Rating (1 to 5, 0 clears)"></div>
      <button type="button" class="icon-btn fav" id="v-fav" aria-pressed="false" aria-label="Favourite" title="Favourite (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.5-9.3C1.2 7.9 3.3 4.5 6.8 4.5c2 0 3.4 1.1 4.2 2.3h2c.8-1.2 2.2-2.3 4.2-2.3 3.5 0 5.6 3.4 4.3 6.7-2 4.7-9.5 9.3-9.5 9.3Z"/></svg>
      </button>
      <button type="button" class="btn" id="v-details" aria-pressed="true" title="Hide details (I)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/></svg>Details
      </button>
    </header>
    <div class="v-body">
      <div class="v-stage">
        <button type="button" class="v-nav prev" id="v-prev" aria-label="Previous" title="Previous (←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg></button>
        <div class="v-media" id="v-media"></div>
        <button type="button" class="v-nav next" id="v-next" aria-label="Next" title="Next (→)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <aside class="v-panel" id="v-panel" aria-label="Details"></aside>
    </div>
  </div>
  <script type="module" src="/ui/app.js?v={{VERSION}}"></script>
</body>
</html>

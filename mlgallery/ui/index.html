<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="mlg-token" content="{{TOKEN}}">
  <title>{{APP}}</title>
  <link rel="icon" href="/ui/icon.png">
  <link rel="stylesheet" href="/ui/app.css?v={{VERSION}}">
</head>
<body>
  <div class="app" id="app">
    <nav class="side" id="side" aria-label="Library">
      <div class="side-head">
        <button type="button" class="icon-btn" id="side-hide" aria-label="Hide the sidebar" title="Hide the sidebar (Ctrl+B)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
        </button>
        <button type="button" class="icon-btn" id="add" aria-label="Add a folder" title="Add a folder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="nav-label">Library</div>
      <div class="nav-group">
        <button type="button" class="nav-item" id="view-all">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span class="label">All</span><span class="n" id="all-count"></span>
        </button>
        <button type="button" class="nav-item" id="view-recent" title="What you opened lately, last first">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <span class="label">Recently viewed</span>
        </button>
        <button type="button" class="nav-item" id="view-random" title="Everything in a shuffled order (click again to shuffle again)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5c2.5 0 4 1.5 5.5 4.5S15 16 17.5 16H21M3 16h3.5c1.3 0 2.3-.4 3.2-1.2M14.3 8.2C15.2 7.4 16.2 7 17.5 7H21M18.5 4.5 21 7l-2.5 2.5M18.5 13.5 21 16l-2.5 2.5"/></svg>
          <span class="label">Random</span>
        </button>
        <button type="button" class="nav-item" id="view-trash" title="What you deleted here: put it back any time, or empty it to the Recycle Bin">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          <span class="label">Trash</span><span class="n" id="trash-count"></span>
        </button>
        <button type="button" class="nav-item" id="view-downloads" title="Pictures you downloaded, to file into the library" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M4 15v4h16v-4"/></svg>
          <span class="label">New downloads</span><span class="badge-n" id="inbox-count" hidden></span>
        </button>
      </div>
      <div class="nav-group" id="kind-nav" hidden>
        <button type="button" class="nav-item" data-is="ai" title="The files with generation data (is:ai)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg>
          <span class="label">AI generations</span>
        </button>
        <button type="button" class="nav-item" data-is="photo" title="Photos: files with a date taken (is:photo)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span class="label">Photos</span>
        </button>
        <button type="button" class="nav-item" data-is="illustration" title="Illustrations: everything else (is:illustration)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>
          <span class="label">Illustrations</span>
        </button>
      </div>
      <div class="nav-sep"></div>
      <div class="nav-label">Organise</div>
      <div class="nav-group">
        <button type="button" class="nav-item" id="view-characters">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
          <span class="label" id="characters-label">Characters</span><span class="n" id="char-count"></span>
        </button>
        <button type="button" class="nav-item" id="view-review" title="Files a weak rule matched, waiting for a yes or no">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          <span class="label">To review</span><span class="badge-n" id="review-count" hidden></span>
        </button>
        <button type="button" class="nav-item" id="view-swipe" title="Swipe review: the pictures you're looking at (a folder, an album, a search; else all of them), one at a time. A or left: delete; D or right: keep; W or up: favourite">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="4" width="11" height="15" rx="2" transform="rotate(8 12.5 11.5)"/><rect x="5" y="5" width="11" height="15" rx="2"/></svg>
          <span class="label">Swipe</span>
        </button>
        <button type="button" class="nav-item" id="view-duplicates" title="Copies of one file, and the same picture saved twice">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          <span class="label">Duplicates</span>
        </button>
        <button type="button" class="nav-item" id="view-artists" title="Who made your pictures, and where they're from" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1.2 0 1.8-.9 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8Z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="15" cy="7" r="1.2"/></svg>
          <span class="label">Artists</span><span class="n" id="artist-count"></span>
        </button>
      </div>
      <div class="nav-sep"></div>
      <div class="nav-label">Insights</div>
      <div class="nav-group">
        <button type="button" class="nav-item" id="view-stats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span class="label">Statistics</span>
        </button>
        <button type="button" class="nav-item" id="view-history" title="What you changed, with Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg>
          <span class="label">History</span>
        </button>
      </div>
      <div class="nav-sep"></div>
      <div class="nav-label">Folders</div>
      <div class="nav-group" id="folders"></div>
      <div class="nav-sep"></div>
      <div class="nav-label with-act">Albums
        <button type="button" class="icon-btn small" id="album-tidy" aria-label="Tidy up albums" title="Tidy up: albums that only repeat a folder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.6 4.2 4.2 1.6-4.2 1.6L12 15.1l-1.6-4.2-4.2-1.6 4.2-1.6Z"/><path d="M18.5 14.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8Z"/></svg>
        </button>
        <button type="button" class="icon-btn small" id="album-new" aria-label="New album" title="New album">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="nav-group" id="albums"></div>
      <div class="side-foot">
        <button type="button" class="nav-item" id="view-settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          <span class="label">Settings</span>
        </button>
        <button type="button" class="nav-item" id="help-btn" title="Shortcuts and search (?)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6M12 17h.01"/></svg>
          <span class="label">Shortcuts and search</span><kbd>?</kbd>
        </button>
      </div>
    </nav>

    <main class="main">
      <button type="button" class="icon-btn side-show-page" id="side-show-page" aria-label="Show the sidebar" title="Show the sidebar (Ctrl+B)" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
      </button>
      <header class="toolbar">
        <button type="button" class="icon-btn" id="side-show" aria-label="Show the sidebar" title="Show the sidebar (Ctrl+B)" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
        </button>
        <div class="title"><h1 id="view-title">All</h1><span class="count" id="count" aria-live="polite" aria-atomic="true"></span></div>
        <button type="button" class="btn" id="shuffle" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.5c2.5 0 4 1.5 5.5 4.5S15 16 17.5 16H21M3 16h3.5c1.3 0 2.3-.4 3.2-1.2M14.3 8.2C15.2 7.4 16.2 7 17.5 7H21M18.5 4.5 21 7l-2.5 2.5M18.5 13.5 21 16l-2.5 2.5"/></svg>Shuffle again
        </button>
        <div class="search" id="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          <div class="chips" id="chips"></div>
          <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search prompts, models, tags…" aria-label="Search"
                 aria-autocomplete="list" aria-controls="suggest" title="Search (Ctrl+F or /)">
          <button type="button" class="clear" id="q-clear" aria-label="Clear the search" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <div class="suggest" id="suggest" role="listbox" hidden></div>
        </div>
        <button type="button" class="icon-btn" id="save-search" aria-label="Save this search as a smart album" title="Save this search as a smart album" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5M10.5 8v5M8 10.5h5"/></svg>
        </button>
        <button type="button" class="btn" id="empty-trash" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Empty the Trash</button>
        <button type="button" class="icon-btn toggle" id="f-fav" aria-pressed="false" aria-label="Favourites only" title="Favourites only">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.5-9.3C1.2 7.9 3.3 4.5 6.8 4.5c2 0 3.4 1.1 4.2 2.3h2c.8-1.2 2.2-2.3 4.2-2.3 3.5 0 5.6 3.4 4.3 6.7-2 4.7-9.5 9.3-9.5 9.3Z"/></svg>
        </button>
        <label class="select" title="Show only files rated at least this">
          <select id="f-rating" aria-label="Rating">
            <option value="">Any rating</option>
            <option value="1">1 star or more</option>
            <option value="2">2 stars or more</option>
            <option value="3">3 stars or more</option>
            <option value="4">4 stars or more</option>
            <option value="5">5 stars</option>
            <option value="0">Unrated</option>
          </select>
        </label>
        <div class="seg small density" id="density" role="group" aria-label="Tile size">
          <button type="button" data-tile="130" title="Compact (Ctrl+1)">Compact</button><button type="button" data-tile="200" title="Comfortable (Ctrl+2)">Comfortable</button><button type="button" data-tile="320" title="Large (Ctrl+3)">Large</button>
        </div>
        <div class="zoom" title="Tile size (Ctrl + mouse wheel, Ctrl+= and Ctrl+−)">
          <button type="button" class="icon-btn small" id="zoom-out" aria-label="Smaller tiles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <input type="range" id="zoom-range" step="2" aria-label="Tile size">
          <button type="button" class="icon-btn small" id="zoom-in" aria-label="Bigger tiles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <button type="button" class="btn" id="view-btn" aria-haspopup="menu" title="Layout, thumbnails, sort, what's shown">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          <span id="view-label">View</span>
        </button>
      </header>
      <div class="grid-area">
      <div class="grid-scroll" id="scroll" tabindex="-1">
        <div class="day-pin" id="day-pin" aria-hidden="true"></div>
        <div class="grid-sizer" id="sizer" role="listbox" aria-multiselectable="true" aria-label="Files"></div>
      </div>
      <div class="scrub" id="scrub" aria-hidden="true" hidden><span class="scrub-tip" id="scrub-tip" hidden></span></div>
      <div class="empty" id="empty" hidden></div>
      </div>
      <section class="stats" id="stats" aria-label="Statistics" hidden></section>
      <footer class="statusbar">
        <span class="dot" id="status-dot"></span><span id="status">Up to date</span>
        <span class="spacer"></span><span id="status-right"></span>
      </footer>
      <div class="selbar" id="selbar" role="toolbar" aria-label="Selected files" hidden></div>
    </main>
  </div>

  <div class="viewer" id="viewer" hidden>
    <header class="v-bar">
      <button type="button" class="icon-btn" id="v-close" title="Back to the library (Esc)" aria-label="Back to the library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg></button>
      <span class="v-pos" id="v-pos"></span>
      <span class="v-name" id="v-name"></span>
      <div class="spacer"></div>
      <div class="v-zoom" id="v-zoom">
        <input type="range" id="v-zoom-range" min="0" max="1000" aria-label="Zoom">
        <span class="v-zoom-pct" id="v-zoom-pct" aria-live="off"></span>
      </div>
      <div class="spacer"></div>
      <div class="v-edit" id="v-edit" hidden></div>
      <button type="button" class="icon-btn" id="v-play" aria-pressed="false" title="Slideshow (P); right-click for its pace" aria-label="Slideshow">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M8 5v14l11-7z"/><path class="i-pause" d="M8 5v14M16 5v14"/></svg>
      </button>
      <div class="v-tools" id="v-tools" role="toolbar" aria-label="Picture">
        <button type="button" class="icon-btn" id="v-flip" title="Flip horizontally (Shift+F)" aria-label="Flip horizontally"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M9 7 4 17h5ZM15 7l5 10h-5Z"/></svg></button>
        <button type="button" class="icon-btn" id="v-rotate" title="Rotate (Shift+R)" aria-label="Rotate"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="11" height="11" rx="1.5"/><path d="M9 5h5a5 5 0 0 1 5 5v1M16.5 8.5 19 11l2.5-2.5"/></svg></button>
        <button type="button" class="icon-btn" id="v-crop" title="Crop (Shift+C)" aria-label="Crop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg></button>
        <span class="bar-sep"></span>
        <button type="button" class="icon-btn" id="v-actual" title="Actual size (Ctrl+0)" aria-label="Actual size"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10v4M15 10v4M11.5 10.5h.01M11.5 13.5h.01"/></svg></button>
        <button type="button" class="icon-btn" id="v-fit" title="Fit to the window (`)" aria-label="Fit to the window"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <span class="bar-sep"></span>
      <div class="stars" id="v-stars" role="group" aria-label="Rating (1 to 5, 0 clears)"></div>
      <button type="button" class="icon-btn fav" id="v-fav" aria-pressed="false" aria-label="Favourite" title="Favourite (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.5-9.3C1.2 7.9 3.3 4.5 6.8 4.5c2 0 3.4 1.1 4.2 2.3h2c.8-1.2 2.2-2.3 4.2-2.3 3.5 0 5.6 3.4 4.3 6.7-2 4.7-9.5 9.3-9.5 9.3Z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="v-details" aria-pressed="true" title="Hide details (I)" aria-label="Details"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/></svg></button>
    </header>
    <div class="v-body">
      <div class="v-stage">
        <button type="button" class="v-nav prev" id="v-prev" aria-label="Previous" title="Previous (←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg></button>
        <div class="v-media" id="v-media" tabindex="-1"></div>
        <button type="button" class="v-nav next" id="v-next" aria-label="Next" title="Next (→)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <aside class="v-panel" id="v-panel" aria-label="Details"></aside>
    </div>
  </div>
  <script type="module" src="/ui/app.js?v={{VERSION}}"></script>
</body>
</html>
